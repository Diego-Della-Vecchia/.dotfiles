general.import = [
  "./catppuccin-frappe.toml"
]

[terminal.shell]
program = "wsl.exe"
args = ["~"]

[window]
padding = { x = 4, y = 2 }

[font]
size = 14.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"
